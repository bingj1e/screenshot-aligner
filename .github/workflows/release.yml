name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Test
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Build exe
        run: powershell -ExecutionPolicy Bypass -File packaging\build-exe.ps1
      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} dist/ScreenshotAligner.exe --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
